<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Inglés Inteligente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid #334155; }
    </style>
</head>
<body class="h-screen flex flex-col p-4 md:p-8">
    <div class="max-w-5xl w-full mx-auto flex justify-between items-center mb-8">
        <h1 class="text-2xl font-bold text-blue-400">📖 Lector Decodificador AI</h1>
        <button onclick="document.getElementById('settingsModal').classList.remove('hidden')" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-semibold transition shadow-md">⚙️ API Key</button>
    </div>

    <!-- Main Reading Area -->
    <div class="flex-1 flex flex-col items-center justify-center max-w-5xl w-full mx-auto glass-panel rounded-3xl p-6 md:p-12 shadow-2xl relative">
        
        <!-- Pantalla Inicial -->
        <div id="setupArea" class="w-full text-center max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold mb-2 text-slate-100">Comienza a leer</h2>
            <p class="text-slate-400 mb-6">Pega aquí un texto, artículo o párrafo de tu libro en inglés. Lo dividiremos oración por oración.</p>
            <textarea id="textInput" rows="6" class="w-full bg-slate-900/80 border border-slate-600 rounded-xl p-5 text-slate-200 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 mb-6 text-lg transition" placeholder="Ej: Once Hansel had sworn to be good, his life was quite bearable..."></textarea>
            <button onclick="startReading()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-xl font-bold w-full transition shadow-[0_0_20px_rgba(37,99,235,0.4)] text-lg">
                📚 Procesar Texto
            </button>
        </div>

        <!-- Pantalla de Lectura (Oración por Oración) -->
        <div id="readingArea" class="hidden w-full flex-col items-center justify-center min-h-[400px]">
            <div class="text-slate-400 mb-6 text-sm font-mono tracking-widest uppercase bg-slate-800/50 px-4 py-2 rounded-full">
                Oración <span id="currentIndex" class="text-blue-400 font-bold">1</span> de <span id="totalIndex" class="font-bold">X</span>
            </div>
            
            <p id="currentSentence" class="text-3xl md:text-5xl font-bold text-center leading-tight text-slate-100 mb-12 min-h-[180px] flex items-center justify-center max-w-4xl"></p>
            
            <button onclick="analyzeSentence()" id="analyzeBtn" class="bg-purple-600 hover:bg-purple-500 text-white px-8 py-4 rounded-full font-bold transition shadow-[0_0_20px_rgba(147,51,234,0.4)] flex items-center gap-3 mb-10 text-lg group">
                <span class="group-hover:scale-110 transition">✨</span> Decodificar con IA
            </button>

            <!-- Controles Inferiores -->
            <div class="flex justify-between w-full max-w-lg mt-auto">
                <button onclick="prevSentence()" class="px-6 py-4 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl transition flex items-center gap-2 border border-slate-700 hover:border-slate-500">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Anterior
                </button>
                <button onclick="nextSentence()" class="px-6 py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl transition flex items-center gap-2 shadow-lg shadow-blue-500/20">
                    Siguiente <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Resultados de Análisis (Tarjetas) -->
    <div id="analysisResult" class="max-w-5xl w-full mx-auto mt-8 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4 pb-12"></div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 p-8 rounded-3xl max-w-md w-full border border-slate-600 shadow-2xl relative">
            <h3 class="text-2xl font-bold mb-2">Llave de Gemini AI</h3>
            <p class="text-slate-400 text-sm mb-6">Esta web funciona al 100% en tu navegador y se conecta directo a Google. Pega tu API Key gratuita de Google AI Studio.</p>
            <input type="password" id="apiKeyInput" placeholder="AQ.Ab8RN6..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white mb-8 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            <div class="flex justify-end gap-4">
                <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="px-6 py-3 text-slate-300 hover:text-white transition font-medium">Cerrar</button>
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-500/30">Guardar Llave</button>
            </div>
        </div>
    </div>

    <script>
        let sentences = [];
        let currentIndex = 0;
        
        window.onload = () => {
            const key = localStorage.getItem('gemini_api_key');
            if(key) document.getElementById('apiKeyInput').value = key;
            
            const savedText = localStorage.getItem('saved_text');
            const savedIndex = localStorage.getItem('saved_index');
            
            if (savedText && savedIndex !== null) {
                document.getElementById('textInput').value = savedText;
                if(confirm("Tienes una lectura guardada. ¿Deseas continuar por donde te quedaste?")) {
                    startReading(parseInt(savedIndex));
                }
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            localStorage.setItem('gemini_api_key', key);
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function startReading(startIndex = 0) {
            const text = document.getElementById('textInput').value.trim();
            if(!text) return alert('Por favor ingresa un texto.');
            
            localStorage.setItem('saved_text', text);
            
            sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
            sentences = sentences.map(s => s.trim()).filter(s => s.length > 2);
            
            if(sentences.length > 0) {
                currentIndex = startIndex;
                document.getElementById('setupArea').classList.add('hidden');
                document.getElementById('readingArea').classList.remove('hidden');
                document.getElementById('readingArea').classList.add('flex');
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('currentSentence').innerText = sentences[currentIndex];
            document.getElementById('currentIndex').innerText = currentIndex + 1;
            document.getElementById('totalIndex').innerText = sentences.length;
            document.getElementById('analysisResult').innerHTML = '';
            
            localStorage.setItem('saved_index', currentIndex);
        }

        function prevSentence() {
            if (currentIndex > 0) { currentIndex--; updateUI(); }
        }

        function nextSentence() {
            if (currentIndex < sentences.length - 1) { currentIndex++; updateUI(); }
        }

        async function analyzeSentence() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) {
                document.getElementById('settingsModal').classList.remove('hidden');
                return alert('Primero necesitas agregar tu API Key de Gemini en la configuración.');
            }
            
            const sentence = sentences[currentIndex];
            const btn = document.getElementById('analyzeBtn');
            btn.innerHTML = '⏳ Analizando con Gemini...';
            btn.disabled = true;

            const prompt = `Actúa como un profesor de decodificación de inglés para adultos hispanos. Analiza la siguiente oración y divídela en su estructura lógica para leerla por bloques (Su-V-O Dó-Cu, o la estructura que aplique si es compleja).
Oración a analizar: "${sentence}"

Devuelve ÚNICAMENTE un JSON con un arreglo de objetos. No uses markdown. Formato exacto requerido:
[
  {"type": "Sujeto / Verbo / etc", "en": "fragmento en inglés", "phonetic": "pronunciación figurada con acento hispano (ej: guas cuáit berabol)", "es": "traducción literal en contexto"}
]`;

            try {
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + apiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { response_mime_type: "application/json" }
                    })
                });
                
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                const jsonStr = data.candidates[0].content.parts[0].text;
                const chunks = JSON.parse(jsonStr);
                
                renderAnalysis(chunks);
            } catch(e) {
                alert('Error al contactar a la IA: ' + e.message);
            } finally {
                btn.innerHTML = '✨ Decodificar con IA';
                btn.disabled = false;
            }
        }

        function renderAnalysis(chunks) {
            const container = document.getElementById('analysisResult');
            container.innerHTML = '';
            chunks.forEach(chunk => {
                container.innerHTML += `
                    <div class="glass-panel p-5 rounded-2xl border border-slate-600/50 hover:border-blue-500/80 transition transform hover:-translate-y-1 shadow-lg">
                        <div class="text-xs font-bold uppercase tracking-wider text-blue-400 mb-3">${chunk.type}</div>
                        <div class="text-2xl font-bold text-white mb-2 leading-tight">${chunk.en}</div>
                        <div class="text-slate-400 font-serif mb-3 border-l-2 border-slate-600 pl-3">/${chunk.phonetic}/</div>
                        <div class="text-emerald-400 font-medium">${chunk.es}</div>
                    </div>
                `;
            });
            
            setTimeout(() => {
                container.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
    </script>
</body>
</html>
